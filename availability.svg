<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="saga-chart-t saga-chart-d" font-family="system-ui, sans-serif"><style>.saga-bg{fill:#fff}.saga-ink{fill:#222}.saga-muted{fill:#555}.saga-grid{stroke:#ddd}.saga-bar{fill:#3f7d3a}@media (prefers-color-scheme: dark){.saga-bg{fill:#151d17}.saga-ink{fill:#e4ebe6}.saga-muted{fill:#9eaca3}.saga-grid{stroke:#2c3830}.saga-bar{fill:#7fb35c}}</style><title id="saga-chart-t">Monthly uptime, October 2026</title><desc id="saga-chart-d">Percentage of each month the stack's apps answered their health checks, outside the daily maintenance window. The axis starts at 95%.</desc><rect width="640" height="320" fill="#fff" class="saga-bg"/><text x="56" y="28" font-size="16" font-weight="600" fill="#222" class="saga-ink">Monthly uptime</text><line x1="56" x2="624" y1="248.0" y2="248.0" stroke="#ddd" class="saga-grid"/><text x="48" y="252.0" font-size="11" text-anchor="end" fill="#555" class="saga-muted">95%</text><line x1="56" x2="624" y1="148.0" y2="148.0" stroke="#ddd" class="saga-grid"/><text x="48" y="152.0" font-size="11" text-anchor="end" fill="#555" class="saga-muted">97.5%</text><line x1="56" x2="624" y1="48.0" y2="48.0" stroke="#ddd" class="saga-grid"/><text x="48" y="52.0" font-size="11" text-anchor="end" fill="#555" class="saga-muted">100%</text><rect x="316.0" y="85.6" width="48.0" height="162.4" rx="3" fill="#3f7d3a" class="saga-bar"><title>October 2026: 99.06%</title></rect><text x="340.0" y="79.6" font-size="12" text-anchor="middle" fill="#333" class="saga-ink">99.06%</text><text x="340.0" y="266" font-size="12" text-anchor="middle" fill="#555" class="saga-muted">Oct 26</text><text x="56" y="300" font-size="11" fill="#555" class="saga-muted">Uptime outside the daily maintenance window, from ElfHosted's health checks. Axis starts at 95%.</text></svg>
